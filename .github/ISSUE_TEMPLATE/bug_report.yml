name: 버그 신고
description: 재현 가능한 PyKR 오동작을 알려주세요.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 보안 취약점은 공개 이슈 대신 SECURITY.md의 비공개 절차를 사용해 주세요.
  - type: input
    id: version
    attributes:
      label: PyKR 버전
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 환경
      placeholder: Windows 11, Python 3.12, VS Code 1.90
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법
      description: 민감한 데이터가 없는 최소 코드와 순서를 적어주세요.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 결과
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 결과와 오류 메시지
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 확인
      options:
        - label: 공개해도 되는 최소 예제만 첨부했습니다.
          required: true
        - label: 최신 1.x 버전에서도 재현되는지 확인했습니다.
          required: true
