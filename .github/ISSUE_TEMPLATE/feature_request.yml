name: 기능 제안
description: PyKR의 기존 범위 안에서 개선을 제안합니다.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 기능 목록보다 현재 막히는 사용 사례를 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 최소 해결 방법
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 검토한 대안
  - type: checkboxes
    id: scope
    attributes:
      label: 범위 확인
      options:
        - label: 새로운 언어 문법이나 자연어 코드 생성을 요구하지 않습니다.
          required: true
        - label: 표준 Python으로 변환 가능한 표기 변경입니다.
          required: true
